name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 platforms;android-37 build-tools;36.0.0 build-tools;37.0.0 ndk;27.1.12297006'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci --include=dev
      - name: TypeScript and booking tests
        run: |
          npm run check
          npm test
      - name: Restore app configuration and signing key
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!process.env.EXPO_PUBLIC_SUPABASE_URL || !process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY) throw new Error('Missing Supabase repository secrets');
          if (process.env.FIREBASE_JSON) fs.writeFileSync('google-services.json', process.env.FIREBASE_JSON);
          if (!process.env.KEYSTORE_BASE64) throw new Error('Missing ANDROID_KEYSTORE_BASE64');
          fs.mkdirSync('.keys', { recursive: true });
          fs.writeFileSync('.keys/memento-release.jks', Buffer.from(process.env.KEYSTORE_BASE64, 'base64'));
          NODE
      - name: Build signed standalone APK
        if: github.event_name != 'pull_request'
        env:
          MEMENTO_KEYSTORE_FILE: ${{ github.workspace }}/.keys/memento-release.jks
          MEMENTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEMENTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEMENTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI: '1'
        run: npm run apk
      - name: APK checksum
        if: github.event_name != 'pull_request'
        run: cd build && sha256sum memento.apk > memento.apk.sha256
      - name: Verify APK release certificate
        if: github.event_name != 'pull_request'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          EXPECTED=$(keytool -exportcert -keystore .keys/memento-release.jks -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | sha256sum | cut -d' ' -f1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs build/memento.apk > build/signature.txt
          ACTUAL=$(sed -n 's/.* certificate SHA-256 digest: //p' build/signature.txt | tr -d '\r' | sort -u)
          echo "Expected release certificate SHA-256: $EXPECTED"
          echo "APK certificate SHA-256: $ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || { echo 'APK release certificate mismatch'; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: memento-android-${{ github.run_number }}
          path: |
            build/memento.apk
            build/memento.apk.sha256
            build/signature.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memento-android-${{ github.run_number }}
          path: build
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG="android-build-$RUN_NUMBER"
          fi
          gh release create "$TAG" build/memento.apk build/memento.apk.sha256 \
            --target "$COMMIT" --title "Memento Android $RUN_NUMBER" \
            --notes "Standalone React Native Android APK. Commit: $COMMIT. Download memento.apk on your Android phone." --latest
          echo "### Download APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/latest/download/memento.apk" >> "$GITHUB_STEP_SUMMARY"
