name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Validate source
        run: npm run validate
      - name: Validate Android JavaScript bundle
        run: npm run bundle:android
      - uses: actions/setup-java@v4
        if: github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: github.event_name != 'pull_request'
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK from project configuration
        if: github.event_name != 'pull_request'
        run: npm run android:sdk
      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'pull_request'
      - name: Restore app configuration and signing key
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          if (!process.env.EXPO_PUBLIC_SUPABASE_URL || !process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY) throw new Error('Missing Supabase repository secrets');
          if (process.env.FIREBASE_JSON) fs.writeFileSync('google-services.json', process.env.FIREBASE_JSON);
          if (!process.env.KEYSTORE_BASE64) throw new Error('Missing ANDROID_KEYSTORE_BASE64');
          fs.mkdirSync('.keys', { recursive: true });
          fs.writeFileSync('.keys/memento-release.jks', Buffer.from(process.env.KEYSTORE_BASE64, 'base64'));
          NODE
      - name: Build and verify signed standalone APK
        if: github.event_name != 'pull_request'
        env:
          MEMENTO_KEYSTORE_FILE: ${{ github.workspace }}/.keys/memento-release.jks
          MEMENTO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEMENTO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEMENTO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CI: '1'
        run: |
          npm run apk
          npm run apk:verify
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request' && hashFiles('build/memento.apk') != ''
        with:
          name: memento-android-${{ github.run_number }}
          path: |
            build/memento.apk
            build/memento.apk.sha256
            build/signature.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: memento-android-${{ github.run_number }}
          path: build
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG="android-build-$RUN_NUMBER"
          fi
          gh release create "$TAG" build/memento.apk build/memento.apk.sha256 \
            --target "$COMMIT" --title "Memento Android $RUN_NUMBER" \
            --notes "Standalone React Native Android APK. Commit: $COMMIT. Download memento.apk on your Android phone." --latest
          echo "### Download APK" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/latest/download/memento.apk" >> "$GITHUB_STEP_SUMMARY"
